name: docker-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set image tag
        id: vars
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE=q99266/sapper-agent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            q99266/sapper-agent:${{ steps.vars.outputs.tag }}
            q99266/sapper-agent:latest
          labels: |
            org.opencontainers.image.source=https://github.com/q99266/sapper-v2
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
